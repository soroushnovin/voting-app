apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: result
  namespace: voting-app
  labels:
    app: result
spec:
  replicas: 2
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: result
          image: docker.io/dockersamples/examplevotingapp_result:before
          ports:
            - name: result
              containerPort: 80
  strategy:
    canary:
      canaryService: result-canary
      stableService: result
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
