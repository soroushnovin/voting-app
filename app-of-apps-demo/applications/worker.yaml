apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: worker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/soroushnovin/voting-app.git
    targetRevision: main
    path: app-of-apps-demo/worker

  destination:
    server: https://kubernetes.default.svc
    namespace: voting-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true