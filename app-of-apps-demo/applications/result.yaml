apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: result
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/soroushnovin/voting-app.git
    targetRevision: main
    path: app-of-apps-demo/result
  destination:
    server: https://kubernetes.default.svc
    namespace: voting-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
