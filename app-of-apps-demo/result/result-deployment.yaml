apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
  namespace: voting-result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      dnsPolicy: ClusterFirst
      containers:
      - image: docker.io/dockersamples/examplevotingapp_result:before
        name: result
        ports:
        - containerPort: 80
          name: result
        env:
          - name: POSTGRES_HOST
            value: postgres.voting-db.svc.cluster.local

          - name: POSTGRES_PORT
            value: "5432"
